name: Residency

on:
  push:
    paths:
      - 'src/**'
      - 'build.zig*'
      - 'tools/residency_server_smoke.py'
      - '.github/workflows/residency.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.zig*'
      - 'tools/residency_server_smoke.py'
      - '.github/workflows/residency.yml'
  # Real-model gates are heavy: nightly, or on demand.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Run real-model residency gates'
        type: boolean
        default: true

jobs:
  fast:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, hooks: false, simd: false, repack: true }
          - { os: ubuntu-latest, hooks: true, simd: false, repack: false }
          - { os: ubuntu-latest, hooks: true, simd: false, repack: true }
          - { os: ubuntu-latest, hooks: false, simd: true, repack: true }
          - { os: windows-latest, hooks: false, simd: false, repack: true }
          - { os: windows-latest, hooks: true, simd: false, repack: false }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install NASM
        if: matrix.simd
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Test
        run: zig build test -Dsimd-backend=${{ matrix.simd }} -Dggml-residency-hooks=${{ matrix.hooks }} -Dcpu-repack=${{ matrix.repack }}
      - name: Build and check GGML patch drift
        run: zig build -Dsimd-backend=${{ matrix.simd }} -Dggml-residency-hooks=${{ matrix.hooks }} -Dcpu-repack=${{ matrix.repack }}

  models:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.models)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dense transformer; also drives the server gate.
          - name: llama
            repo: unsloth/Llama-3.2-1B-Instruct-GGUF
            file: Llama-3.2-1B-Instruct-Q4_K_M.gguf
            sha256: 3f5a22426976ab26cfe84dba63c1d08391717abb1af893e10f1b2968d862dcc1
            tokens: '1,128000'
            server: true
          # Hybrid Gated DeltaNet + attention (recurrent state).
          - name: qwen35
            repo: unsloth/Qwen3.5-4B-GGUF
            file: Qwen3.5-4B-Q4_K_S.gguf
            sha256: 27caeb0e4b999d92ce0a9fdbdd1a7ba5112908d9de125645883732274be2ea77
            tokens: '1,1000'
            server: false
    env:
      MODEL: models/${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models/${{ matrix.file }}
          key: gguf-${{ matrix.sha256 }}
      - name: Download and verify model
        run: |
          mkdir -p models
          if [ ! -f "$MODEL" ]; then
            curl -L --fail --retry 3 -o "$MODEL" "https://huggingface.co/${{ matrix.repo }}/resolve/main/${{ matrix.file }}"
          fi
          echo "${{ matrix.sha256 }}  $MODEL" | sha256sum -c -
      # Each mode fails with a named invariant error (LogitMismatch,
      # NodeHookImbalance, ResidencyBudgetExceeded, FailedGraphLeakedPins, ...).
      - name: Exact gates, CPU_REPACK off (single, concurrent, cancel, fail)
        run: |
          for mode in single concurrent cancel fail; do
            echo "::group::$mode"
            zig build validate-ggml-backend -Doptimize=ReleaseFast -Dsimd-backend=false \
              -Dggml-residency-hooks=true -Dcpu-repack=false -- "$MODEL" ${{ matrix.tokens }} 4 $mode
            echo "::endgroup::"
          done
      # Backed weights cannot use the repacked kernels, so this compares two
      # kernel families; the fixed 0.1/0.02 tolerance is calibrated for Llama.
      # Qwen3.5 keeps top-1 but exceeds it (max 0.48), which is repack numerics.
      - name: Default CPU_REPACK tolerance and top-1 gate
        if: matrix.name == 'llama'
        run: |
          zig build validate-ggml-backend -Doptimize=ReleaseFast -Dsimd-backend=false \
            -Dggml-residency-hooks=true -- "$MODEL" ${{ matrix.tokens }} 4
      - name: Server gate
        if: matrix.server
        run: |
          zig build -Doptimize=ReleaseFast -Dsimd-backend=false -Dggml-residency-hooks=true -Dcpu-repack=false
          python3 tools/residency_server_smoke.py --exe zig-out/bin/MLz --model "$MODEL"
      - name: Server logs
        if: failure() && matrix.server
        run: tail -n 200 residency_smoke_*.log || true
